# Builds the site from src/ and publishes it to GitHub Pages on every change to main, and once a day.
# If the build finds a mistake it stops with a clear message and the live site stays as it is.
name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"   # daily rebuild so new answers from the questions sheet are built into the site

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install
        run: pip install -r src/requirements.txt
      - name: Check data and build site
        run: python src/build.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
